<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;}
  .canvas{
    width:1024px;height:1024px;
    background:#14120F;
    position:relative;
    box-sizing:border-box;
    border-radius:56px;
    border:6px solid rgba(95,163,150,0.28);
    overflow:hidden;
  }
  .glow{
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 46%, rgba(95,163,150,0.22), rgba(95,163,150,0) 68%);
  }
  .mark{
    position:absolute; top:50%; left:50%;
    width:62%; height:62%;
    transform: translate(-50%,-50%);
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <svg class="mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M54.1,16.5 A27,27 0 1 0 54.1,47.5" stroke="#F5F2EA" stroke-width="2" stroke-opacity="0.7" stroke-linecap="round"/>
      <path d="M18,14 L32,30 M46,14 L32,30 M32,30 L32,50" stroke="#5FA396" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>
</body>
</html>
