<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#5FA396;
    --surface:#14120F;
    --text:#DDD8CE;
    --text-dim:#9C9686;
    --text-bright:#F5F2EA;
    --border: rgba(245,240,230,0.08);
  }
  html,body{margin:0;padding:0;}
  .canvas{
    width:1200px;height:630px;
    background:var(--surface);
    position:relative;
    overflow:hidden;
    font-family:'Plus Jakarta Sans','Noto Sans TC',sans-serif;
    box-sizing:border-box;
  }
  .glow{
    position:absolute; inset:0;
    background: radial-gradient(circle at 30% 50%, rgba(95,163,150,0.16), rgba(95,163,150,0) 60%);
  }
  .ring-deco{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(95,163,150,0.10);
  }
  .ring-deco.r1{ width:900px; height:900px; left:-260px; top:-135px; }
  .ring-deco.r2{ width:700px; height:700px; left:-160px; top:-35px; border-color: rgba(95,163,150,0.06); }

  .content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    align-items:center;
    padding:0 88px;
    gap:56px;
  }

  .icon-frame{
    flex:none;
    width:220px; height:220px;
    border:1px solid rgba(95,163,150,0.28);
    border-radius:10px;
    position:relative;
    box-shadow:0 0 40px rgba(95,163,150,0.10);
    display:flex; align-items:center; justify-content:center;
    background:rgba(95,163,150,0.03);
  }
  .icon-frame .mark-glow{
    position:absolute; inset:0;
    background: radial-gradient(circle at 50% 45%, rgba(95,163,150,0.18), rgba(95,163,150,0) 70%);
  }
  .icon-frame svg{ width:62%; height:62%; position:relative; z-index:1; }

  .text-block{ flex:1; min-width:0; }

  .eyebrow{
    font-size:19px; font-weight:700; letter-spacing:0.32em; text-transform:uppercase;
    color:var(--accent); margin-bottom:22px; display:flex; align-items:center; gap:14px;
  }
  .eyebrow .dash{ width:28px; height:1px; background:var(--accent); display:inline-block; }

  .wordmark{
    font-size:76px; font-weight:800; letter-spacing:-0.01em; color:var(--text-bright);
    line-height:1.05; margin:0 0 26px 0; white-space:nowrap;
  }
  .wordmark .accent{ color:var(--accent); }

  .tagline{
    font-size:26px; font-weight:500; color:var(--text-dim); line-height:1.55; max-width:760px;
  }
  .tagline strong{ color:var(--text); font-weight:700; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="ring-deco r1"></div>
    <div class="ring-deco r2"></div>
    <div class="content">
      <div class="icon-frame">
        <div class="mark-glow"></div>
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ringGrad-og" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#FFFFFF"/>
              <stop offset="45%" stop-color="#F5F2EA"/>
              <stop offset="100%" stop-color="#C7C0AE"/>
            </linearGradient>
            <linearGradient id="yGrad-og" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#8CD2C2"/>
              <stop offset="48%" stop-color="#5FA396"/>
              <stop offset="100%" stop-color="#3C7A6D"/>
            </linearGradient>
            <filter id="glow-og" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="0.8" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path d="M54.1,16.5 A27,27 0 1 0 54.1,47.5" stroke="url(#ringGrad-og)" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" filter="url(#glow-og)"/>
          <path d="M18,14 L32,30 M46,14 L32,30 M32,30 L32,50" stroke="url(#yGrad-og)" stroke-width="4" stroke-linecap="round" filter="url(#glow-og)"/>
        </svg>
      </div>
      <div class="text-block">
        <div class="eyebrow"><span class="dash"></span>Brand &amp; Web Engineering</div>
        <h1 class="wordmark">YC AXIOM <span class="accent">[æ]</span></h1>
        <p class="tagline">專注為商業品牌打造<strong>高質感數位門面</strong>。結合極簡視覺美學與高效能前端工程。</p>
      </div>
    </div>
  </div>
</body>
</html>
